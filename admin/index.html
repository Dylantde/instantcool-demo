<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#07090F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Instantcool 後台</title>
<style>
/* ==========================================================================
   INSTANTCOOL 後台 — admin.css

   A back office is read for hours at a time, so this is a light, dense
   information surface rather than a restyled version of the consumer app.
   The ice accent carries the brand across; everything else is built for
   scanning tables and spotting the one row that needs attention.
   ========================================================================== */

:root{
  /* brand */
  --ic:#0E92BC;
  --ic-deep:#0A7395;
  --ic-soft:#E4F4FA;
  --ic-ring:rgba(14,146,188,.28);

  /* semantic — separate from the accent on purpose */
  --ok:#0E8A63;      --ok-bg:#E2F5EE;
  --warn:#A96407;    --warn-bg:#FDF0DC;
  --bad:#C0392F;     --bad-bg:#FBE8E6;
  --idle:#5B6B7C;    --idle-bg:#EDF1F5;

  /* neutrals, biased very slightly cyan so they sit with the accent */
  --bg:#F4F7F9;
  --surface:#FFFFFF;
  --surface-2:#F8FAFC;
  --line:#E2E8EE;
  --line-2:#CFD8E1;

  --tx:#0D1B26;
  --tx-2:#54657A;
  --tx-3:#8695A6;

  --r:10px; --r-lg:14px;
  --nav-w:230px;
  --top-h:60px;
  --shadow:0 1px 2px rgba(13,27,38,.06),0 8px 24px rgba(13,27,38,.06);
  --font:"PingFang HK","Hiragino Sans CNS","Noto Sans HK","Microsoft JhengHei",
         -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:var(--ic);text-decoration:none}
svg{width:18px;height:18px;flex:none}
:focus-visible{outline:2px solid var(--ic);outline-offset:2px;border-radius:4px}

/* ---------- shell -------------------------------------------------------- */
.shell{display:flex;min-height:100vh}

.nav{
  width:var(--nav-w);flex:none;background:#0C1C27;color:#C7D4DE;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.nav__brand{display:flex;align-items:center;gap:9px;height:var(--top-h);padding:0 18px;flex:none}
.nav__brand svg{color:#3FC9EF;width:22px;height:22px}
.nav__brand b{color:#fff;font-size:16px;font-weight:800;letter-spacing:-.01em}
.nav__brand b em{font-style:normal;color:#3FC9EF}
.nav__brand span{font-size:10px;color:#6C8091;margin-left:2px;letter-spacing:.08em}

.nav__scroll{flex:1;overflow-y:auto;padding:6px 10px 18px}
.nav__group{margin-top:14px;padding:0 8px 4px;font-size:10.5px;font-weight:700;
  letter-spacing:.12em;color:#5E7285}
.nav__item{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;
  border-radius:8px;color:#C7D4DE;font-size:13.5px;text-align:left;margin-bottom:1px;
}
.nav__item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav__item.is-active{background:var(--ic);color:#fff;font-weight:600}
.nav__item.is-active svg{color:#fff}
.nav__item svg{color:#7F94A6;width:17px;height:17px}
.nav__badge{
  margin-left:auto;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;
  min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;
}
.nav__item.is-active .nav__badge{background:rgba(255,255,255,.28)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}

.top{
  height:var(--top-h);flex:none;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:20;
}
.top__title{font-size:16px;font-weight:700}
.top__crumb{font-size:12px;color:var(--tx-3)}
.top__right{margin-left:auto;display:flex;align-items:center;gap:10px}
.top__user{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);font-size:12.5px}
.top__user b{font-weight:600}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--ic);color:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:700}

.page{padding:22px;max-width:1440px;width:100%}

/* ---------- demo ribbon -------------------------------------------------- */
.demo{
  background:var(--warn-bg);border:1px solid #F0D8AE;color:var(--warn);
  padding:9px 13px;border-radius:var(--r);font-size:12.5px;font-weight:600;margin-bottom:18px;
}

/* ---------- kpi cards ---------------------------------------------------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:15px 16px;position:relative;overflow:hidden;
}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ic)}
.kpi--ok::before{background:var(--ok)} .kpi--warn::before{background:var(--warn)}
.kpi--bad::before{background:var(--bad)} .kpi--idle::before{background:var(--idle)}
.kpi__label{font-size:12px;color:var(--tx-2);display:flex;align-items:center;gap:6px}
.kpi__label svg{width:15px;height:15px;color:var(--tx-3)}
.kpi__value{font-size:27px;font-weight:800;margin-top:5px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.1}
.kpi__value small{font-size:13px;font-weight:600;color:var(--tx-2);margin-left:3px}
.kpi__sub{font-size:11.5px;color:var(--tx-3);margin-top:4px}
.delta{font-size:11.5px;font-weight:700}
.delta--up{color:var(--ok)} .delta--down{color:var(--bad)}

/* ---------- panels ------------------------------------------------------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-top:18px}
.panel__head{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel__title{font-size:14px;font-weight:700}
.panel__hint{font-size:12px;color:var(--tx-3)}
.panel__tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.panel__body{padding:16px}
.panel__body--flush{padding:0}

/* ---------- tiles (the 待辦 / 智能檢測 grids) ----------------------------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{
  border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;text-align:left;
  background:var(--surface-2);transition:border-color .12s,background .12s;
}
.tile:hover{border-color:var(--line-2);background:#fff}
.tile__v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.tile__k{font-size:12px;color:var(--tx-2);margin-top:2px}
.tile--attention{border-color:#F0C9C4;background:var(--bad-bg)}
.tile--attention .tile__v{color:var(--bad)}
.tile--warn{border-color:#F0D8AE;background:var(--warn-bg)}
.tile--warn .tile__v{color:var(--warn)}
.tile--clear .tile__v{color:var(--tx-3)}

/* ---------- table -------------------------------------------------------- */
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{
  text-align:left;font-weight:600;font-size:11.5px;color:var(--tx-2);
  padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
  background:var(--surface-2);position:sticky;top:0;
}
table.t td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tbody tr:last-child td{border-bottom:0}
table.t tbody tr:hover{background:var(--surface-2)}
table.t .num{text-align:right;font-variant-numeric:tabular-nums}
table.t .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--tx-2)}
.t__main{font-weight:600}
.t__sub{font-size:11.5px;color:var(--tx-3)}

/* ---------- tags --------------------------------------------------------- */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:2px 9px;border-radius:999px;background:var(--idle-bg);color:var(--idle);white-space:nowrap}
.tag--ok{background:var(--ok-bg);color:var(--ok)}
.tag--warn{background:var(--warn-bg);color:var(--warn)}
.tag--bad{background:var(--bad-bg);color:var(--bad)}
.tag--ic{background:var(--ic-soft);color:var(--ic-deep)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

/* ---------- controls ----------------------------------------------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;
  padding:0 14px;border-radius:8px;font-size:13px;font-weight:600;
  background:var(--ic);color:#fff;border:1px solid var(--ic)}
.btn:hover{background:var(--ic-deep);border-color:var(--ic-deep)}
.btn--ghost{background:var(--surface);color:var(--tx);border-color:var(--line-2)}
.btn--ghost:hover{background:var(--surface-2);border-color:var(--tx-3)}
.btn--sm{height:28px;padding:0 10px;font-size:12px}
.btn--link{background:none;border:0;color:var(--ic);padding:0;height:auto;font-weight:600}
.btn[disabled]{opacity:.45;pointer-events:none}

.field{height:34px;padding:0 11px;border:1px solid var(--line-2);border-radius:8px;
  background:var(--surface);min-width:0}
.field:focus{outline:none;border-color:var(--ic);box-shadow:0 0 0 3px var(--ic-ring)}
select.field{padding-right:26px}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:10px;color:var(--tx-3);width:15px;height:15px}
.search .field{padding-left:31px;width:230px}

.segs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);
  border-radius:8px;padding:2px;gap:2px}
.segs button{height:28px;padding:0 13px;border-radius:6px;font-size:12.5px;
  font-weight:600;color:var(--tx-2)}
.segs button.is-active{background:var(--surface);color:var(--tx);box-shadow:var(--shadow)}

/* ---------- misc --------------------------------------------------------- */
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.empty{padding:52px 20px;text-align:center;color:var(--tx-3)}
.empty svg{width:34px;height:34px;opacity:.45;margin-bottom:9px}
.muted{color:var(--tx-2)}
.tiny{font-size:11.5px;color:var(--tx-3);line-height:1.6}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.hr{height:1px;background:var(--line);margin:14px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}

/* meter bar used for utilisation / battery */
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--ic);border-radius:3px}
.meter--ok i{background:var(--ok)} .meter--warn i{background:var(--warn)}
.meter--bad i{background:var(--bad)}

/* 7-day bars on the dashboard */
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}
.bars div{flex:1;background:linear-gradient(180deg,var(--ic),#9FD9EA);border-radius:4px 4px 0 0;min-height:3px}
.bars-x{display:flex;gap:8px;margin-top:6px}
.bars-x span{flex:1;text-align:center;font-size:10.5px;color:var(--tx-3)}

/* ---------- modal -------------------------------------------------------- */
.scrim{position:fixed;inset:0;background:rgba(13,27,38,.42);z-index:50;
  display:grid;place-items:center;padding:24px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 20px 60px rgba(0,0,0,.25);
  width:min(560px,100%);max-height:86vh;overflow-y:auto;animation:pop .16s}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal__head{padding:15px 18px;border-bottom:1px solid var(--line);font-weight:700}
.modal__body{padding:18px}
.modal__foot{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;font-size:13px}
.kv + .kv{border-top:1px solid var(--line)}
.kv span{color:var(--tx-2)}
.kv b{font-variant-numeric:tabular-nums}

/* ---------- toast -------------------------------------------------------- */
.toast{position:fixed;right:22px;bottom:22px;background:#0C1C27;color:#fff;
  padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:80;
  box-shadow:0 12px 32px rgba(0,0,0,.28);animation:pop .16s}

/* ---------- login -------------------------------------------------------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1000px 520px at 50% -10%,#DCEFF7,var(--bg))}
.login__card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.login__brand{display:flex;align-items:center;gap:9px;justify-content:center;margin-bottom:5px}
.login__brand svg{width:26px;height:26px;color:var(--ic)}
.login__brand b{font-size:21px;font-weight:800;letter-spacing:-.02em}
.login__brand b em{font-style:normal;color:var(--ic)}
.login .field{width:100%;height:40px}
.login .btn{width:100%;height:40px}

</style>
</head>
<body>
<div id="root"></div>
<script>
/* ==== src/lib/config.js ==== */
/* ==========================================================================
   config.js — 後台設定

   同一條規則沿用自 H5 前台：這裡只放對外或營運層面的數字。
   採購成本、毛利率、財務模型等內部數據一律不寫入前端程式碼——
   打包後的 JS 是可讀的，即使是後台亦應假設終有一日會外洩。
   ========================================================================== */
window.IC = window.IC || {};

IC.config = {
  brand: {
    name: 'Instantcool',
    entity: 'Instantcool Technology Limited',
    console: '營運後台'
  },

  /* 與前台 config.js 相同的收費設定。生產環境應由同一個後端供應， */
  /* 避免兩套系統各自維護一份而出現分歧。                              */
  pricing: {
    currency: 'HKD',
    ratePerHour: 8.00,
    promoRatePerHour: 6.00,
    billingBlockMinutes: 30,
    preAuthDeposit: 100.00
  },

  venue: {
    sharePct: 0.35,
    settlementDay: 10          // 每月 10 號結算上月分成
  },

  retail: {
    listPrice: 268.00,
    memberPrice: 228.00
  },

  hardware: {
    cabinetSlots: 8,
    fanBatteryMah: 5000,
    uvDisinfectSeconds: 90,
    lowBatteryPct: 30,         // 低於此電量即列為需補電
    offlineAfterMinutes: 5     // 心跳中斷超過此時間即視為離線
  },

  runtime: {
    apiMode: 'mock',           // 'mock' | 'live'
    apiBaseUrl: '/api/admin/v1',
    demoData: true
  }
};

/* ==== src/lib/util.js ==== */
/* util.js — 格式化、DOM、雜項。無外部依賴。 */
window.IC = window.IC || {};

IC.util = {
  el: function (s, r) { return (r || document).querySelector(s); },
  els: function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); },

  /** 所有進入 innerHTML 的外部字串都必須先經過這裡。 */
  esc: function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  },

  on: function (root, sel, fn, evt) {
    root.addEventListener(evt || 'click', function (e) {
      var t = e.target.closest(sel);
      if (t && root.contains(t)) fn(e, t);
    });
  },

  money: function (n, symbol) {
    var v = Math.abs(Number(n) || 0);
    var s = v.toLocaleString('en-HK', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (Number(n) < 0 ? '−' : '') + (symbol === false ? '' : 'HK$') + s;
  },

  money0: function (n) {
    return 'HK$' + Math.round(Number(n) || 0).toLocaleString('en-HK');
  },

  num: function (n) { return (Number(n) || 0).toLocaleString('en-HK'); },

  pct: function (n, digits) { return (Number(n) * 100).toFixed(digits == null ? 0 : digits) + '%'; },

  /** "2026-09-17 14:32" */
  stamp: function (ts) {
    var d = new Date(ts), p = function (x) { return x < 10 ? '0' + x : String(x); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
           ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  },

  date: function (ts) { return IC.util.stamp(ts).slice(0, 10); },

  /** 「3 分鐘前」「2 小時前」——機櫃心跳這類欄位用相對時間好讀得多。 */
  ago: function (ts) {
    var s = Math.max(0, (Date.now() - ts) / 1000);
    if (s < 60) return Math.floor(s) + ' 秒前';
    if (s < 3600) return Math.floor(s / 60) + ' 分鐘前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小時前';
    return Math.floor(s / 86400) + ' 日前';
  },

  duration: function (mins) {
    var h = Math.floor(mins / 60), m = Math.round(mins % 60);
    return (h ? h + ' 小時 ' : '') + m + ' 分鐘';
  },

  id: function (p) {
    return (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  },

  delay: function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); },

  toCsv: function (rows) {
    return rows.map(function (r) {
      return r.map(function (c) {
        var v = String(c == null ? '' : c);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(',');
    }).join('\r\n');
  },

  /**
   * 能否真的觸發下載。
   * 嵌入式預覽（把這個檔案放進 iframe 的展示頁）會封鎖由頁面發起的下載，
   * 而且是靜默失敗——撳咗冇反應最難查。偵測到就改為把 CSV 直接顯示出來
   * 讓人複製，至少不會甚麼都沒發生。
   */
  canDownload: function () {
    try { return window.self === window.top; } catch (e) { return false; }
  },

  /** 匯出 CSV。BOM 是為了 Excel 正確辨識 UTF-8 中文。回傳是否真的下載了。 */
  downloadCsv: function (filename, rows) {
    var csv = IC.util.toCsv(rows);

    if (!IC.util.canDownload()) { IC.util.showCsv(filename, csv); return false; }

    var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
    return true;
  },

  /** 下載被封鎖時的後備：直接顯示 CSV 內容供複製。 */
  showCsv: function (filename, csv) {
    var scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<div class="modal__head">匯出 CSV</div>' +
        '<div class="modal__body">' +
          '<p class="tiny" style="margin:0 0 10px">' +
            '此預覽環境不容許直接下載檔案。以下為 ' + IC.util.esc(filename) +
            ' 的內容，可全選複製後貼上 Excel。在本機或正式伺服器執行時會直接下載。</p>' +
          '<textarea class="field" readonly style="width:100%;height:220px;padding:10px;' +
            'font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5">' +
            IC.util.esc(csv) + '</textarea>' +
        '</div>' +
        '<div class="modal__foot">' +
          '<button class="btn btn--ghost" data-x="close">關閉</button>' +
          '<button class="btn" data-x="copy">複製全部</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(scrim);
    var ta = scrim.querySelector('textarea');
    scrim.addEventListener('click', function (e) {
      if (e.target === scrim || e.target.closest('[data-x="close"]')) return scrim.remove();
      if (e.target.closest('[data-x="copy"]')) {
        ta.select();
        var done = function () { IC.toast('已複製 CSV 內容'); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(csv).then(done, done);
        } else { try { document.execCommand('copy'); } catch (x) {} done(); }
      }
    });
  }
};

/* ==== src/lib/revenue.js ==== */
/* ==========================================================================
   revenue.js — 「甚麼算收入」只在這裡定義一次。

   概覽頁與收益報表本來各自判斷，結果同一天的租借收入出現兩個數字。
   任何一張報表只要自行寫一次篩選條件，這種分歧就會再出現，所以規則集中在此。

   已確認收入 = 已完成的訂單。租借中及逾期的訂單尚未請款，不計入；
   已退款的訂單不計入。
   ========================================================================== */
window.IC = window.IC || {};

IC.revenue = {
  /** 已確認的租借訂單。 */
  rentalsRecognised: function (orders) {
    return (orders || []).filter(function (o) { return o.status === 'completed'; });
  },

  /** 已確認的零售訂單：備貨中及已寄出都已收款，只有退款不算。 */
  retailRecognised: function (rows) {
    return (rows || []).filter(function (r) { return r.status !== 'refunded'; });
  },

  sum: function (rows) {
    return (rows || []).reduce(function (s, r) { return s + (r.amount || 0); }, 0);
  },

  /** 場地應計分成：按該場地自己的分成比率，逐張訂單計算。 */
  venueAccrual: function (orders, venues) {
    var byName = {};
    (venues || []).forEach(function (v) { byName[v.name] = v.sharePct; });
    return IC.revenue.rentalsRecognised(orders).reduce(function (s, o) {
      var pct = byName[o.venueName] != null ? byName[o.venueName] : IC.config.venue.sharePct;
      return s + o.amount * pct;
    }, 0);
  }
};

/* ==== src/lib/store.js ==== */
/* store.js — 極簡狀態容器。登入狀態會存 localStorage，重新整理不會登出。 */
window.IC = window.IC || {};

IC.store = (function () {
  var KEY = 'ic.admin.v1';
  var subs = [];
  var state = { signedIn: false, user: null, todo: null };

  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || '{}');
    state.signedIn = !!saved.signedIn;
  } catch (e) { /* 私隱模式：改為只存記憶體 */ }

  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify({ signedIn: state.signedIn })); } catch (e) {}
  }

  return {
    get: function () { return state; },
    set: function (patch) {
      Object.assign(state, patch); persist();
      subs.forEach(function (f) { f(state); });
    },
    subscribe: function (f) { subs.push(f); },
    reset: function () { state.signedIn = false; state.user = null; persist(); }
  };
})();

/* ==== src/lib/router.js ==== */
/* ==========================================================================
   router.js — hash router。路由自行註冊到 IC.routes。
   route = { title, crumb?, render(params), mount?(root, params), unmount?(),
             nav?: '<nav key>', guard?: 'auth' }
   ========================================================================== */
window.IC = window.IC || {};
IC.routes = IC.routes || {};

IC.router = (function () {
  var mountEl = null, current = null, name = null;

  function parse() {
    var h = (location.hash || '#/dashboard').replace(/^#\/?/, '');
    var parts = h.split('?');
    var seg = (parts[0] || 'dashboard').split('/');
    var params = {};
    (parts[1] || '').split('&').forEach(function (kv) {
      if (!kv) return;
      var p = kv.split('=');
      params[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
    });
    if (seg.length > 1) params.id = seg.slice(1).join('/');
    return { name: seg[0], params: params, raw: h };
  }

  function render() {
    var r = parse();
    var route = IC.routes[r.name] || IC.routes.dashboard;

    if (route.guard === 'auth' && !IC.store.get().signedIn) {
      location.hash = '#/login?next=' + encodeURIComponent(r.raw);
      return;
    }
    // 已登入就不應再看到登入頁
    if (r.name === 'login' && IC.store.get().signedIn) {
      location.hash = '#/dashboard';
      return;
    }

    if (current && current.unmount) { try { current.unmount(); } catch (e) {} }

    var isLogin = r.name === 'login';
    document.body.classList.toggle('is-login', isLogin);
    IC.shell.toggle(!isLogin);

    var host = isLogin ? document.getElementById('root') : document.getElementById('page');
    if (isLogin) {
      document.getElementById('root').innerHTML = '';
      var wrap = document.createElement('div');
      wrap.innerHTML = route.render(r.params);
      host.appendChild(wrap);
      current = route; name = r.name;
      if (route.mount) route.mount(wrap, r.params);
      return;
    }

    IC.shell.ensure();
    host = document.getElementById('page');
    host.innerHTML = route.render(r.params);
    IC.shell.setTitle(route.title, route.crumb);
    IC.shell.setActive(route.nav || r.name);
    current = route; name = r.name;
    if (route.mount) route.mount(host, r.params);
    host.scrollTop = 0;
    window.scrollTo(0, 0);
  }

  return {
    start: function (el) {
      mountEl = el;
      window.addEventListener('hashchange', render);
      render();
    },
    go: function (p) { location.hash = '#/' + String(p).replace(/^#?\/*/, ''); },
    refresh: render,
    get current() { return name; }
  };
})();

/* ==== src/api/client.js ==== */
/* ==========================================================================
   client.js — 後台唯一資料出入口。

   所有畫面只呼叫 IC.api，不自行 fetch。'mock' 模式由 fixtures 提供資料，
   'live' 模式打同名端點（見 docs/API-SPEC.md）。切換時畫面程式碼不用改。
   ========================================================================== */
window.IC = window.IC || {};

IC.api = (function () {
  var mock = function () { return IC.config.runtime.apiMode === 'mock'; };
  var db = null;
  function seed() { if (!db) db = JSON.parse(JSON.stringify(IC.fixtures)); return db; }

  function request(method, path, body) {
    return fetch(IC.config.runtime.apiBaseUrl + path, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      if (!r.ok) throw Object.assign(new Error('HTTP ' + r.status), { status: r.status });
      return r.status === 204 ? null : r.json();
    });
  }

  function list(key, path) {
    return function () {
      if (mock()) return IC.util.delay(160).then(function () { return seed()[key]; });
      return request('GET', path);
    };
  }

  var api = {
    get: function (p) { return request('GET', p); },
    post: function (p, b) { return request('POST', p, b); },

    signIn: function (email, password) {
      if (mock()) {
        return IC.util.delay(600).then(function () {
          if (!email || !password) throw new Error('invalid_credentials');
          return seed().admin;
        });
      }
      return request('POST', '/auth/login', { email: email, password: password });
    },

    cabinets:    list('cabinets', '/cabinets'),
    fans:        list('fans', '/fans'),
    venues:      list('venues', '/venues'),
    users:       list('users', '/users'),
    orders:      list('orders', '/orders?type=rental'),
    retail:      list('retail', '/orders?type=retail'),
    withdrawals: list('withdrawals', '/withdrawals'),
    hygiene:     list('hygiene', '/hygiene-logs'),
    news:        list('news', '/announcements'),

    /** 概覽頁一次過取得所有統計，避免首頁打十個端點。 */
    overview: function () {
      if (mock()) {
        return IC.util.delay(240).then(function () {
          var d = seed();
          var online = d.cabinets.filter(function (c) { return c.status === 'online'; }).length;
          var dayAgo = Date.now() - 86400000;
          // 一律走 IC.revenue，避免這裡與收益報表各自判斷而對不上數。
          var completed = IC.revenue.rentalsRecognised(d.orders);
          var todayOrders = completed.filter(function (o) { return o.startedAt >= dayAgo; });
          var rentalRev = IC.revenue.sum(completed);
          var retailRev = IC.revenue.sum(IC.revenue.retailRecognised(d.retail));
          return {
            revenueTotal: rentalRev + retailRev,
            revenueToday: IC.revenue.sum(todayOrders),
            rentalRevenue: rentalRev,
            retailRevenue: retailRev,
            ordersTotal: d.orders.length + d.retail.length,
            ordersToday: todayOrders.length,
            cabinets: d.cabinets.length,
            cabinetsOnline: online,
            fans: d.fans.length,
            fansAvailable: d.fans.filter(function (f) { return f.status === 'available'; }).length,
            users: d.users.length,
            venuesActive: d.venues.filter(function (v) { return v.status === 'active'; }).length,
            venuesPipeline: d.venues.filter(function (v) { return v.status !== 'active'; }).length,
            // 待批核的提現申請金額（與收益報表的「本期應計分成」是兩回事）
            pendingWithdrawals: d.withdrawals.filter(function (w) { return w.status === 'pending'; })
                              .reduce(function (s, w) { return s + w.amount; }, 0),
            daily: d.daily,
            todo: api.todoCounts()
          };
        });
      }
      return request('GET', '/overview');
    },

    /** 待辦：需要人手處理的項目。導覽列的紅點也讀這裡。 */
    todoCounts: function () {
      var d = seed();
      return {
        offline:    d.cabinets.filter(function (c) { return c.status === 'offline'; }).length,
        fault:      d.cabinets.filter(function (c) { return c.status === 'fault'; }).length,
        unplaced:   d.cabinets.filter(function (c) { return c.status === 'unplaced'; }).length,
        lowBattery: d.fans.filter(function (f) {
                      return f.battery < IC.config.hardware.lowBatteryPct && f.status !== 'rented';
                    }).length,
        lostFans:   d.fans.filter(function (f) { return f.status === 'lost'; }).length,
        overdue:    d.orders.filter(function (o) { return o.status === 'overdue'; }).length,
        withdrawals:d.withdrawals.filter(function (w) { return w.status === 'pending'; }).length,
        uvFailed:   d.hygiene.filter(function (h) { return h.result === 'aborted'; }).length,
        venuesPending: d.venues.filter(function (v) { return v.status !== 'active'; }).length
      };
    },

    /** 批核提現。真實環境必須是後端動作並留審計紀錄。 */
    approveWithdrawal: function (id) {
      if (mock()) {
        return IC.util.delay(500).then(function () {
          var w = seed().withdrawals.filter(function (x) { return x.id === id; })[0];
          if (w) { w.status = 'paid'; w.paidAt = Date.now(); }
          return w;
        });
      }
      return request('POST', '/withdrawals/' + encodeURIComponent(id) + '/approve');
    },

    /** 遠端指令：重啟機櫃 / 開櫃門。這些都是有後果的動作，UI 必須先確認。 */
    cabinetCommand: function (id, command) {
      if (mock()) return IC.util.delay(700).then(function () { return { id: id, command: command, ok: true }; });
      return request('POST', '/cabinets/' + encodeURIComponent(id) + '/commands', { command: command });
    }
  };

  return api;
})();

  if (old) old.remove();

/** 確認框。有後果的動作（批核、遠端開櫃）必須先經過這裡。 */
IC.confirm = function (o) {
  return new Promise(function (resolve) {
    var scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<div class="modal__head">' + IC.util.esc(o.title) + '</div>' +
        '<div class="modal__body">' + (o.bodyHtml || '<p class="muted" style="margin:0">' +
          IC.util.esc(o.body || '') + '</p>') + '</div>' +
        '<div class="modal__foot">' +
          '<button class="btn btn--ghost" data-x="no">' + IC.util.esc(o.cancel || '取消') + '</button>' +
          '<button class="btn" data-x="yes">' + IC.util.esc(o.confirm || '確定') + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(scrim);
    function close(v) { scrim.remove(); document.removeEventListener('keydown', esc); resolve(v); }
    function esc(e) { if (e.key === 'Escape') close(false); }
    document.addEventListener('keydown', esc);
    scrim.addEventListener('click', function (e) {
      if (e.target === scrim) return close(false);
      var b = e.target.closest('[data-x]');
      if (b) close(b.getAttribute('data-x') === 'yes');
    });
    scrim.querySelector('[data-x="yes"]').focus();
  });
};

/** 詳情視窗（唯讀）。 */
IC.detail = function (title, rows, extraHtml) {
  var scrim = document.createElement('div');

      '<div class="modal__head">' + IC.util.esc(title) + '</div>' +
      '<div class="modal__body">' +
        rows.map(function (r) {
          return '<div class="kv"><span>' + IC.util.esc(r[0]) + '</span><b>' + (r[2] ? r[1] : IC.util.esc(r[1])) + '</b></div>';
        }).join('') + (extraHtml || '') +
      '</div>' +
      '<div class="modal__foot"><button class="btn btn--ghost" data-x="close">關閉</button></div>' +
    '</div>';
  document.body.appendChild(scrim);
  scrim.addEventListener('click', function (e) {
    if (e.target === scrim || e.target.closest('[data-x="close"]')) scrim.remove();
  });
};

/* ==== src/components/table.js ==== */
/* ==========================================================================
   table.js — 共用資料表。

   每一張列表頁的需求都一樣：搜尋、篩選、排序、匯出 CSV。寫一次，
   九張表共用，省下的不只是行數——而是九張表的行為保證一致。

   用法：
     IC.table(host, {
       columns: [{ key, label, align?, width?, render?(row), sort?(a,b), csv?(row) }],
       rows: [...],
       searchKeys: ['id','name'],
       filters: [{ key, label, options:[{v,label}], match(row, v) }],
       empty: '未有資料',
       onRow: function (row) {}          // 可選：點擊一列
     })
   ========================================================================== */
window.IC = window.IC || {};

IC.table = function (host, o) {
  var state = { q: '', sort: null, dir: 1, filters: {}, page: 1, per: o.per || 12 };

  function matches(r) {
    if (state.q) {
      var hay = (o.searchKeys || []).map(function (k) { return String(r[k] == null ? '' : r[k]); })
                .join(' ').toLowerCase();
      if (hay.indexOf(state.q.toLowerCase()) === -1) return false;
    }
    return (o.filters || []).every(function (f) {
      var v = state.filters[f.key];
      return !v || v === '__all' || f.match(r, v);
    });
  }

  function sorted(rows) {
    if (!state.sort) return rows;
    var col = o.columns.filter(function (c) { return c.key === state.sort; })[0];
    if (!col) return rows;
    var cmp = col.sort || function (a, b) {
      var x = a[col.key], y = b[col.key];
      if (typeof x === 'number' && typeof y === 'number') return x - y;
      return String(x).localeCompare(String(y), 'zh-HK');
    };
    return rows.slice().sort(function (a, b) { return cmp(a, b) * state.dir; });
  }

  function toolbar() {
    return '<div class="panel__tools">' +
      ((o.filters || []).map(function (f) {
        return '<select class="field" data-f="' + IC.util.esc(f.key) + '">' +
          '<option value="__all">' + IC.util.esc(f.label) + '：全部</option>' +
          f.options.map(function (op) {
            return '<option value="' + IC.util.esc(op.v) + '"' +
              (state.filters[f.key] === op.v ? ' selected' : '') + '>' +
              IC.util.esc(op.label) + '</option>';
          }).join('') + '</select>';
      }).join('')) +
      (o.searchKeys ? '<span class="search">' + IC.icon('search') +
        '<input class="field" data-q placeholder="搜尋…" value="' + IC.util.esc(state.q) + '"></span>' : '') +
      '<button class="btn btn--ghost btn--sm" data-csv>' + IC.icon('download') + '匯出 CSV</button>' +
      '</div>';
  }

  /* `view` is the filtered+sorted array currently on screen. Listeners are
     bound once and read this variable, rather than closing over the array that
     existed when they were attached — binding inside render() left every
     previous render's handler alive, and a row click resolved against the
     oldest one (so clicking a filtered row opened the wrong record). */
  var view = [];
  var bound = false;

  function render() {
    var all = (o.rows || []).filter(matches);
    view = sorted(all);
    var pages = Math.max(1, Math.ceil(view.length / state.per));
    if (state.page > pages) state.page = pages;
    var from = (state.page - 1) * state.per;
    var slice = view.slice(from, from + state.per);

    host.innerHTML =
      '<div class="panel__head">' +
        '<div class="panel__title">' + IC.util.esc(o.title || '') + '</div>' +
        '<div class="panel__hint">' + all.length + ' 項' +
          (all.length !== (o.rows || []).length ? '（共 ' + (o.rows || []).length + ' 項）' : '') +
        '</div>' + toolbar() +
      '</div>' +
      (slice.length
        ? '<div class="tablewrap"><table class="t"><thead><tr>' +
            o.columns.map(function (c) {
              var active = state.sort === c.key;
              return '<th' + (c.align === 'right' ? ' class="num"' : '') +
                (c.width ? ' style="width:' + c.width + '"' : '') + '>' +
                '<button class="btn--link" data-sort="' + IC.util.esc(c.key) + '" ' +
                  'style="font:inherit;color:inherit">' + IC.util.esc(c.label) +
                  (active ? (state.dir > 0 ? ' \u2191' : ' \u2193') : '') + '</button></th>';
            }).join('') + '</tr></thead><tbody>' +
            slice.map(function (r, i) {
              return '<tr data-i="' + (from + i) + '"' +
                (o.onRow ? ' style="cursor:pointer"' : '') + '>' +
                o.columns.map(function (c) {
                  return '<td' + (c.align === 'right' ? ' class="num"' : '') + '>' +
                    (c.render ? c.render(r) : IC.util.esc(r[c.key])) + '</td>';
                }).join('') + '</tr>';
            }).join('') +
          '</tbody></table></div>' +
          (pages > 1
            ? '<div class="spread" style="padding:11px 16px;border-top:1px solid var(--line)">' +
                '<span class="tiny">第 ' + state.page + ' / ' + pages + ' 頁</span>' +
                '<span style="display:flex;gap:6px">' +
                  '<button class="btn btn--ghost btn--sm" data-pg="-1"' +
                    (state.page === 1 ? ' disabled' : '') + '>上一頁</button>' +
                  '<button class="btn btn--ghost btn--sm" data-pg="1"' +
                    (state.page === pages ? ' disabled' : '') + '>下一頁</button>' +
                '</span></div>'
            : '')
        : '<div class="empty">' + IC.icon('search') + '<div>' +
            IC.util.esc(o.empty || '未有符合條件的資料') + '</div></div>');

    bindOnce();
    if (state.focusSearch) {
      var n = host.querySelector('[data-q]');
      if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
      state.focusSearch = false;
    }
  }

  function bindOnce() {
    if (bound) return;
    bound = true;

    host.addEventListener('input', function (e) {
      if (!e.target.matches('[data-q]')) return;
      state.q = e.target.value;
      state.page = 1;
      state.focusSearch = true;
      render();
    });

    host.addEventListener('change', function (e) {
      if (!e.target.matches('[data-f]')) return;
      state.filters[e.target.getAttribute('data-f')] = e.target.value;
      state.page = 1;
      render();
    });

    IC.util.on(host, '[data-sort]', function (e, el) {
      var k = el.getAttribute('data-sort');
      if (state.sort === k) state.dir = -state.dir; else { state.sort = k; state.dir = 1; }
      render();
    });

    IC.util.on(host, '[data-pg]', function (e, el) {
      state.page += Number(el.getAttribute('data-pg'));
      render();
    });

    IC.util.on(host, '[data-csv]', function () {
      // csv: false 的欄位（例如「操作」按鈕）不匯出——空欄位在 Excel 只是雜訊。
      var cols = o.columns.filter(function (c) { return c.csv !== false; });
      var head = cols.map(function (c) { return c.label; });
      var body = view.map(function (r) {
        return cols.map(function (c) {
          return c.csv ? c.csv(r) : (r[c.key] == null ? '' : r[c.key]);
        });
      });
      var ok = IC.util.downloadCsv(
        (o.csvName || 'export') + '_' + IC.util.date(Date.now()) + '.csv',
        [head].concat(body));
      if (ok) IC.toast('已匯出 ' + view.length + ' 項');
    });

    if (o.onRow) {
      IC.util.on(host, 'tbody tr', function (e, tr) {
        if (e.target.closest('button')) return;   // 列內按鈕有自己的處理
        var row = view[Number(tr.getAttribute('data-i'))];
        if (row) o.onRow(row);
      });
    }
  }

  render();
  return { rerender: render, state: state };
};

        '<button class="btn" id="go" style="margin-top:4px">登入</button>' +
      '</div>' +
      '<p class="tiny" style="text-align:center;margin-top:16px">' +
        '示範版本，資料全為模擬。正式環境須啟用雙重認證。</p>' +
    '</div></div>';
  },

  mount: function (root, params) {
    var em = root.querySelector('#em'), pw = root.querySelector('#pw'), go = root.querySelector('#go');
    pw.focus();

    function submit() {
      if (!pw.value) { IC.toast('請輸入密碼'); return; }
      go.disabled = true; go.textContent = '登入中…';
      IC.api.signIn(em.value, pw.value).then(function (admin) {
        IC.store.set({ signedIn: true, user: admin });
        IC.router.go(params.next || 'dashboard');
      }).catch(function () {
        go.disabled = false; go.textContent = '登入';
        IC.toast('電郵或密碼不正確');
      });
    }
    go.addEventListener('click', submit);
    [em, pw].forEach(function (f) {
      f.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
    });
  }
};

            : '') +

                  sub:'租借 ' + IC.util.money0(d.rentalRevenue) + '　·　零售 ' + IC.util.money0(d.retailRevenue) }) +

            kpi({ icon:'receipt', label:'訂單總數', value: IC.util.num(d.ordersTotal),

                  sub:'在線率 ' + IC.util.pct(utilisation) }) +
            kpi({ icon:'fan', label:'風扇可借', value: d.fansAvailable, unit:'/ ' + d.fans,
                  sub:'其餘為租借中、消毒或維修' }) +
            kpi({ icon:'users', label:'註冊用戶', value: IC.util.num(d.users), tone:'idle' }) +
            kpi({ icon:'store', label:'營運中場地', value: d.venuesActive,
                  tone:'idle', sub: d.venuesPipeline + ' 個洽談／待簽約' }) +
            kpi({ icon:'bank', label:'待批核提現', value: IC.util.money0(d.pendingWithdrawals),
                  tone:'warn', sub:'場地夥伴已申請、等待批核' }) +
          '</div>' +

          '<div class="grid2">' +
            '<div class="panel">' +
              '<div class="panel__head">' +
                '<div class="panel__title">待辦事項</div>' +
                '<div class="panel__hint">需要人手跟進</div>' +
              '</div>' +
              '<div class="panel__body"><div class="tiles">' +
                tile({ n:t.offline,     label:'機櫃離線',   go:'cabinets?status=offline',  tone:'attention' }) +
                tile({ n:t.fault,       label:'機櫃故障',   go:'cabinets?status=fault',    tone:'attention' }) +
                tile({ n:t.unplaced,    label:'未投放機櫃', go:'cabinets?status=unplaced' }) +
                tile({ n:t.lowBattery,  label:'低電量風扇', go:'fans?status=charging' }) +
                tile({ n:t.lostFans,    label:'遺失風扇',   go:'fans?status=lost',         tone:'attention' }) +
                tile({ n:t.overdue,     label:'逾期未還',   go:'orders?status=overdue',    tone:'attention' }) +
                tile({ n:t.uvFailed,    label:'消毒中斷',   go:'hygiene?result=aborted',   tone:'attention' }) +
                tile({ n:t.withdrawals, label:'待批提現',   go:'withdrawals?status=pending' }) +
                tile({ n:t.venuesPending, label:'待簽場地', go:'venues?status=pending' }) +
              '</div></div>' +
            '</div>' +

            '<div class="panel">' +
              '<div class="panel__head">' +
                '<div class="panel__title">過去 7 日租借次數</div>' +
                '<div class="panel__hint">全機隊合計</div>' +
              '</div>' +
              '<div class="panel__body">' +
                '<div class="bars">' + d.daily.map(function (v) {
                  return '<div style="height:' + Math.max(4, (v / max) * 100) + '%" title="' + v + ' 次"></div>';
                }).join('') + '</div>' +
                '<div class="bars-x">' + days.map(function (x) {
                  return '<span>' + x + '</span>';
                }).join('') + '</div>' +
                '<div class="hr"></div>' +
                '<div class="kv"><span>7 日合計</span><b>' +
                  IC.util.num(d.daily.reduce(function (s, v) { return s + v; }, 0)) + ' 次</b></div>' +

                  (d.daily.reduce(function (s, v) { return s + v; }, 0) / 7).toFixed(1) + ' 次</b></div>' +

                  (d.cabinetsOnline

                   '<b class="tiny">' + IC.util.date(n.at) + '</b></div>';

        });

        IC.util.on(host, '[data-go]', function (e, el) {
          IC.router.go(el.getAttribute('data-go'));
        });
      });
    }
  };
})();

    });

};

/* ==========================================================================
   hygiene.js — 消毒記錄

   Yellowpal 後台沒有對應功能：充電寶不貼身，風扇貼頸。每次歸還後的
   UV-C 消毒是 Instantcool 對場地及用戶的核心承諾，能否拿得出逐次記錄，
   是能否簽下康文署及食肆場地的關鍵之一。
   ========================================================================== */
window.IC = window.IC || {};

IC.routes.hygiene = {
  title: '消毒記錄', crumb: '營運 / 紫外光消毒', nav: 'hygiene', guard: 'auth',

  render: function () {
    return '<div id="sum" class="kpis"></div><div class="panel" id="tbl"></div>' +
      '<p class="tiny" style="margin-top:12px">' +
      '每次歸還後機櫃會自動執行 UV-C 消毒。中斷的記錄代表該次消毒未完成，' +
      '系統會把該風扇暫時標示為不可借，直至重新消毒。</p>';
  },

  mount: function (host, params) {
    IC.api.hygiene().then(function (rows) {
      var ok = rows.filter(function (r) { return r.result === 'ok'; }).length;
      var aborted = rows.length - ok;

      host.querySelector('#sum').innerHTML =
        '<div class="kpi kpi--ok"><div class="kpi__label">' + IC.icon('shield') + '消毒完成</div>' +
          '<div class="kpi__value">' + ok + '</div>' +
          '<div class="kpi__sub">過去 24 小時</div></div>' +
        '<div class="kpi ' + (aborted ? 'kpi--bad' : 'kpi--idle') + '">' +
          '<div class="kpi__label">' + IC.icon('warn') + '消毒中斷</div>' +
          '<div class="kpi__value">' + aborted + '</div>' +
          '<div class="kpi__sub">' + (aborted ? '需人手覆檢' : '無異常') + '</div></div>' +
        '<div class="kpi"><div class="kpi__label">' + IC.icon('clock') + '完成率</div>' +
          '<div class="kpi__value">' + IC.util.pct(rows.length ? ok / rows.length : 1, 1) + '</div></div>' +
        '<div class="kpi kpi--idle"><div class="kpi__label">' + IC.icon('refresh') + '標準週期</div>' +
          '<div class="kpi__value">' + IC.config.hardware.uvDisinfectSeconds +
          '<small>秒</small></div></div>';

      var t = IC.table(host.querySelector('#tbl'), {
        title: '消毒記錄', csvName: 'uv_logs', rows: rows,
        searchKeys: ['id', 'cabinetId', 'fanId'],
        filters: [{
          key:'result', label:'結果',
          options: [{ v:'ok', label:'完成' }, { v:'aborted', label:'中斷' }],
          match: function (r, v) { return r.result === v; }
        }],
        columns: [
          { key:'id', label:'記錄編號', render: function (r) {
              return '<span class="mono">' + IC.util.esc(r.id) + '</span>'; } },
          { key:'cabinetId', label:'機櫃', render: function (r) {
              return '<span class="mono">' + IC.util.esc(r.cabinetId) + '</span>'; } },
          { key:'slot', label:'格口', align:'right' },
          { key:'fanId', label:'風扇', render: function (r) {
              return '<span class="mono">' + IC.util.esc(r.fanId) + '</span>'; } },
          { key:'startedAt', label:'開始時間',
            render: function (r) { return IC.util.stamp(r.startedAt); },
            csv: function (r) { return IC.util.stamp(r.startedAt); } },
          { key:'durationS', label:'時長', align:'right', render: function (r) {
              var short = r.durationS < IC.config.hardware.uvDisinfectSeconds;

          { key:'result', label:'結果', render: function (r) { return IC.tag('hygiene', r.result); },
            csv: function (r) { return IC.STATUS.hygiene[r.result].label; } }

      });
      if (params.result) { t.state.filters.result = params.result; t.rerender(); }

/* ==== src/views/finance.js ==== */
/* ==========================================================================
   finance.js — 收益報表

   只呈現收入與應付場地分成。公司自身的成本結構、毛利及財務指標刻意不在
   前端計算或顯示，與前台同一條規則——這些留在試算表，不進瀏覽器。
   ========================================================================== */
window.IC = window.IC || {};

IC.routes.finance = {
  title: '收益報表', crumb: '財務 / 收益', nav: 'finance', guard: 'auth',

  render: function () {
    return '<div id="sum" class="kpis"></div>' +
      '<div class="panel"><div class="panel__head">' +
        '<div class="panel__title">按場地劃分</div>' +
        '<div class="panel__hint">租借毛收入及應付分成</div></div>' +
        '<div class="panel__body panel__body--flush" id="byvenue"></div></div>' +
      '<p class="tiny" style="margin-top:12px">' +
      '已確認收入只計已完成的訂單；租借中、逾期及已退款的訂單不計入。' +
      '分成金額 = 該場地租借毛收入 × 該場地的分成比率。' +
      '「本期應計分成」是按訂單累計的應付金額，與「分成提現」頁的已申請金額是兩回事。</p>';
  },

  mount: function (host) {
    Promise.all([IC.api.orders(), IC.api.retail(), IC.api.venues()]).then(function (res) {
      var orders = res[0], retail = res[1], venues = res[2];
      var counted = IC.revenue.rentalsRecognised(orders);
      var rentalRev = IC.revenue.sum(counted);
      var retailRev = IC.revenue.sum(IC.revenue.retailRecognised(retail));
      // 逐張訂單按該場地自己的比率計算，而非全部套用標準 35%。
      var venueDue = IC.revenue.venueAccrual(orders, venues);

      host.querySelector('#sum').innerHTML =
        '<div class="kpi"><div class="kpi__label">' + IC.icon('coins') + '總收益</div>' +
          '<div class="kpi__value">' + IC.util.money0(rentalRev + retailRev) + '</div></div>' +
        '<div class="kpi kpi--idle"><div class="kpi__label">' + IC.icon('receipt') + '租借收入</div>' +
          '<div class="kpi__value">' + IC.util.money0(rentalRev) + '</div>' +
          '<div class="kpi__sub">' + counted.length + ' 張訂單</div></div>' +
        '<div class="kpi kpi--idle"><div class="kpi__label">' + IC.icon('cart') + '零售收入</div>' +
          '<div class="kpi__value">' + IC.util.money0(retailRev) + '</div></div>' +
        '<div class="kpi kpi--warn"><div class="kpi__label">' + IC.icon('bank') + '本期應計分成</div>' +
          '<div class="kpi__value">' + IC.util.money0(venueDue) + '</div>' +
          '<div class="kpi__sub">按各場地比率逐張訂單計算</div></div>';

      /* 按場地匯總 */
      var byVenue = {};
      counted.forEach(function (o) {
        var k = o.venueName || '—';
        byVenue[k] = byVenue[k] || { name: k, orders: 0, gross: 0 };
        byVenue[k].orders += 1;
        byVenue[k].gross += o.amount;
      });
      var rows = Object.keys(byVenue).map(function (k) {
        var v = byVenue[k];
        var def = venues.filter(function (x) { return x.name === k; })[0];
        var pct = def ? def.sharePct : IC.config.venue.sharePct;
        v.sharePct = pct;
        v.due = v.gross * pct;
        return v;
      }).sort(function (a, b) { return b.gross - a.gross; });

      IC.table(host.querySelector('#byvenue'), {
        title: '', csvName: 'revenue_by_venue', rows: rows, per: 20,
        searchKeys: ['name'],
        columns: [
          { key:'name', label:'場地', render: function (r) {
              return '<span class="t__main">' + IC.util.esc(r.name) + '</span>'; } },
          { key:'orders', label:'訂單數', align:'right' },
          { key:'gross', label:'毛收入', align:'right',
            render: function (r) { return IC.util.money(r.gross); },
            csv: function (r) { return r.gross.toFixed(2); } },
          { key:'sharePct', label:'分成比率', align:'right',
            render: function (r) { return IC.util.pct(r.sharePct); },
            csv: function (r) { return IC.util.pct(r.sharePct); } },
          { key:'due', label:'應付分成', align:'right',
            render: function (r) { return '<b>' + IC.util.money(r.due) + '</b>'; },
            csv: function (r) { return r.due.toFixed(2); } }
        ]
      });
    });
  }
};

        '<div class="panel__body">' +
          kv('每部機櫃格口', h.cabinetSlots + ' 格') +
          kv('風扇電池', IC.util.num(h.fanBatteryMah) + ' mAh') +
          kv('UV-C 消毒週期', h.uvDisinfectSeconds + ' 秒') +
          kv('低電量門檻', h.lowBatteryPct + '%') +
          kv('離線判定', '心跳中斷超過 ' + h.offlineAfterMinutes + ' 分鐘') +
        '</div></div>' +

      '<div class="panel" style="margin-top:0"><div class="panel__head">' +
        '<div class="panel__title">帳戶及權限</div></div>' +
        '<div class="panel__body">' +
          kv('目前登入', IC.util.esc(IC.fixtures.admin.name) + '（' +
             IC.util.esc(IC.fixtures.admin.role) + '）') +
          kv('電郵', IC.util.esc(IC.fixtures.admin.email)) +
          kv('雙重認證', '<span class="tag tag--warn"><i class="dot"></i>未啟用</span>') +
          '<div class="hr"></div>' +
          '<p class="tiny" style="margin:0">角色權限（系統管理員／營運／財務／場地夥伴唯讀）' +
          '須於後端實作。前端的隱藏選單不構成權限控制——每個端點都必須自行驗證角色。</p>' +
        '</div></div>' +
    '</div>' +

    '<div class="panel"><div class="panel__head">' +
      '<div class="panel__title">系統資訊</div></div>' +
      '<div class="panel__body">' +
        kv('版本', 'v0.1.0') +
        kv('資料來源', IC.config.runtime.apiMode === 'mock'
            ? '<span class="tag tag--warn"><i class="dot"></i>示範資料（MOCK）</span>'
            : '<span class="tag tag--ok"><i class="dot"></i>正式 API</span>') +
        kv('API 位址', '<span class="mono">' + IC.util.esc(IC.config.runtime.apiBaseUrl) + '</span>') +
      '</div></div>';
  },

  mount: function () {}
};

/* ==== src/main.js ==== */
/* main.js — 啟動。最後載入，此時所有模組已註冊。 */
(function () {
  IC.router.start(document.getElementById('root'));

  /* 未登入時先導向登入頁 */
  if (!IC.store.get().signedIn && location.hash.indexOf('login') === -1) {
    IC.router.go('login');
  }

  /* 給示範及 QA 用的小工具 */
  window.instantcoolAdmin = {
    config: IC.config,
    signIn: function () { IC.store.set({ signedIn: true }); IC.router.go('dashboard'); },
    reset: function () { IC.store.reset(); location.hash = '#/login'; location.reload(); }
  };
})();

</script>
</body>
</html>
